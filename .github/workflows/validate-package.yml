name: Validation Multiplateforme Matériel Érable

run-name: "validate-${{ github.event.client_payload.package_name || inputs.package_name || 'ouch' }}-${{ github.event.client_payload.correlation_id || inputs.correlation_id || github.run_number }}"

permissions: {}

on:
  repository_dispatch:
    types: [validate-package]
  workflow_dispatch:
    inputs:
      package_name:
        description: "Nom du paquet"
        required: true
        default: "ouch"
      version:
        description: "Version du paquet"
        required: false
        default: "latest"
      targets_toml:
        description: "Contenu de targets.toml (optionnel si démo)"
        required: false
      category:
        description: "Catégorie du paquet (cli, gui, fonts)"
        required: false
        default: "cli"
      matrix:
        description: "JSON matrix pré-calculée (optionnel)"
        required: false
      correlation_id:
        description: "Identifiant de corrélation unique"
        required: false
      check_cmd:
        description: "Commande de vérification optionnelle (verification.toml)"
        required: false
      hooks_json:
        description: "Scripts de cycle de vie .nu encodés JSON/gzb64 (optionnel)"
        required: false

jobs:
  validate:
    name: ${{ matrix.os-name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(github.event.client_payload.matrix || inputs.matrix || '{"include":[{"os":"ubuntu-latest","os-name":"linux","arch":"x86_64","target_key":"x86_64-linux"},{"os":"windows-latest","os-name":"windows","arch":"x86_64","target_key":"x86_64-windows"},{"os":"macos-latest","os-name":"macos","arch":"aarch64","target_key":"aarch64-macos"}]}') }}

    steps:
      - name: Récupération du dépôt (runner uniquement)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: runner/validate.py
          sparse-checkout-cone-mode: false

      - name: Configuration de Python (3.12 toolcache)
        id: setup_py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          allow-prereleases: false
          check-latest: false

      - name: Définition de PYTHON_BIN
        shell: bash
        env:
          SETUP_PY_PATH: ${{ steps.setup_py.outputs.python-path }}
        run: |
          if [ -n "$SETUP_PY_PATH" ] && [ -x "$SETUP_PY_PATH" ]; then
            echo "PYTHON_BIN=$SETUP_PY_PATH" >> "$GITHUB_ENV"
            echo "[+] Python configuré : $SETUP_PY_PATH ($("$SETUP_PY_PATH" --version))"
          elif command -v python3 >/dev/null 2>&1; then
            PY_RESOLVED="$(command -v python3)"
            echo "PYTHON_BIN=$PY_RESOLVED" >> "$GITHUB_ENV"
            echo "[+] Python détecté : $PY_RESOLVED ($("$PY_RESOLVED" --version))"
          else
            PY_RESOLVED="$(command -v python)"
            echo "PYTHON_BIN=$PY_RESOLVED" >> "$GITHUB_ENV"
            echo "[+] Python détecté : $PY_RESOLVED ($("$PY_RESOLVED" --version))"
          fi

      - name: Préparation des Manifestes
        id: prep_manifests
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_PKG_NAME: ${{ inputs.package_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets_toml }}
          INPUT_HOOKS_JSON: ${{ inputs.hooks_json }}
          RUNNER_OS_NAME: ${{ matrix.os-name }}
          TARGET_KEY: ${{ matrix.target_key }}
        run: |
          "$PYTHON_BIN" - <<'PY'
          import base64
          import json
          import os
          import tomllib
          import zlib
          from pathlib import Path

          ALLOWED_HOOKS = ("pre_install.nu", "post_install.nu", "pre_uninstall.nu", "post_uninstall.nu")
          OUCH_ARCHIVE_EXTS = (".zip", ".7z", ".tar.gz", ".tgz", ".tar.xz", ".tar.zst", ".tzst", ".tar", ".zst", ".gz", ".xz", ".rar")
          OUCH_ARCHIVE_TYPES = {"zip", "7z", "tar.gz", "tgz", "tar.xz", "tar.zst", "tzst", "tar", "zst", "gz", "xz", "rar"}

          payload_str = os.environ.get("EVENT_PAYLOAD") or ""
          payload = {}
          if payload_str and payload_str != "null":
              try:
                  data = json.loads(payload_str)
                  if isinstance(data, dict):
                      payload = data
              except Exception as e:
                  print("Erreur parsing payload:", e)

          pkg_name = str(payload.get("package_name") or os.environ.get("INPUT_PKG_NAME") or "ouch").strip()
          pkg_version = str(payload.get("version") or os.environ.get("INPUT_VERSION") or "latest").strip()
          print(f"=== Préparation de la recette pour : {pkg_name} v{pkg_version} ===")

          parts_dir = Path("package_test/parts")
          parts_dir.mkdir(parents=True, exist_ok=True)
          (parts_dir / "package.toml").write_text(
              f"name = {json.dumps(pkg_name)}\nversion = {json.dumps(pkg_version)}\n",
              encoding="utf-8",
          )

          targets_content = (payload.get("targets_toml") or os.environ.get("INPUT_TARGETS") or "").strip()

          if not targets_content:
              print("Utilisation de la recette de démonstration ouch 0.8.3...")
              targets_content = """[targets.x86_64-windows]
          url = "https://github.com/ouch-org/ouch/releases/download/0.8.3/ouch-x86_64-pc-windows-msvc.zip"
          sha256 = "6383a95987894412d5c9c4172e3d1d87c86aa322acb2b7ffcad42f492abc5dfe"
          archive_type = "zip"
          extract_dir = "ouch-x86_64-pc-windows-msvc"
          binaries = [ { source = "ouch.exe", alias = "ouch" } ]

          [targets.x86_64-linux]
          url = "https://github.com/ouch-org/ouch/releases/download/0.8.3/ouch-x86_64-unknown-linux-gnu.tar.gz"
          sha256 = "f0664cbb3bf8c5c781637da2c8bb86b4561a8709f7e10ddb1188150e68e619a7"
          archive_type = "tar.gz"
          extract_dir = "ouch-x86_64-unknown-linux-gnu"
          binaries = [ { source = "ouch", alias = "ouch" } ]

          [targets.aarch64-macos]
          url = "https://github.com/ouch-org/ouch/releases/download/0.8.3/ouch-aarch64-apple-darwin.tar.gz"
          sha256 = "969c1bd9105b5033cc9cac0a37c011d23482948d681b43f97c6f79311f3263d0"
          archive_type = "tar.gz"
          extract_dir = "ouch-aarch64-apple-darwin"
          binaries = [ { source = "ouch", alias = "ouch" } ]
          """

          with open(parts_dir / "targets.toml", "w", encoding="utf-8") as f:
              f.write(targets_content)
          print("[+] targets.toml écrit avec succès dans", parts_dir)

          written_hooks = []
          hooks_raw = str(payload.get("hooks_json") or os.environ.get("INPUT_HOOKS_JSON") or "").strip()
          if hooks_raw:
              decoded_str = (
                  zlib.decompress(base64.b64decode(hooks_raw[6:])).decode("utf-8")
                  if hooks_raw.startswith("gzb64:")
                  else hooks_raw
              )
              hooks_map = json.loads(decoded_str)
              if isinstance(hooks_map, dict):
                  for hname in ALLOWED_HOOKS:
                      hcontent = hooks_map.get(hname)
                      if isinstance(hcontent, str) and hcontent.strip():
                          (Path("package_test") / hname).write_text(hcontent, encoding="utf-8")
                          written_hooks.append(hname)

          needs_nu = bool(written_hooks) or (".nu" in targets_content.lower())

          needs_ouch = False
          if pkg_name.lower() != "ouch":
              runner_os = os.environ.get("RUNNER_OS_NAME", "").strip().lower()
              target_key = os.environ.get("TARGET_KEY", "").strip()
              try:
                  parsed_targets = tomllib.loads(targets_content).get("targets", {})
              except Exception:
                  parsed_targets = {}
              candidate_items = (
                  [parsed_targets[target_key]]
                  if target_key and isinstance(parsed_targets.get(target_key), dict)
                  else [v for v in parsed_targets.values() if isinstance(v, dict)]
              )
              for t_info in candidate_items:
                  u_low = str(t_info.get("url") or "").split("?", 1)[0].strip().lower()
                  at_low = str(t_info.get("archive_type") or "").strip().lower()
                  if u_low.endswith(OUCH_ARCHIVE_EXTS) or at_low in OUCH_ARCHIVE_TYPES:
                      needs_ouch = True
                      break
                  if (u_low.endswith(".dmg") or at_low == "dmg") and runner_os != "macos":
                      needs_ouch = True
                      break

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as fh:
                  fh.write(f"needs_nu={'true' if needs_nu else 'false'}\n")
                  fh.write(f"needs_ouch={'true' if needs_ouch else 'false'}\n")
          print(f"[+] Hooks préparés: {written_hooks} | needs_nu={needs_nu} | needs_ouch={needs_ouch}")
          PY

      - name: Résolution des dernières versions nu/ouch et SHA-256 officiels
        id: resolve_tools
        if: steps.prep_manifests.outputs.needs_nu == 'true' || steps.prep_manifests.outputs.needs_ouch == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_NU: ${{ steps.prep_manifests.outputs.needs_nu }}
          NEEDS_OUCH: ${{ steps.prep_manifests.outputs.needs_ouch }}
          TARGET_PAIR: ${{ matrix.os-name }}-${{ matrix.arch }}
        run: |
          "$PYTHON_BIN" - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import os
          import re
          import time
          import urllib.request

          needs_nu = os.environ.get("NEEDS_NU") == "true"
          needs_ouch = os.environ.get("NEEDS_OUCH") == "true"
          target_pair = os.environ.get("TARGET_PAIR", "").strip()
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "Erable-CI-Runner/1.0",
          }
          tok = os.environ.get("GITHUB_TOKEN", "").strip()
          if tok:
              headers["Authorization"] = f"Bearer {tok}"

          def _fetch_json(url: str) -> dict:
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(1.5 * (attempt + 1))
              return {}

          def _resolve(kind: str) -> dict:
              if kind == "nu":
                  rel = _fetch_json("https://api.github.com/repos/nushell/nushell/releases/latest")
                  tag = rel["tag_name"]
                  ver = tag.lstrip("v")
                  assets_map = {
                      "linux-x86_64": f"nu-{ver}-x86_64-unknown-linux-gnu.tar.gz",
                      "linux-aarch64": f"nu-{ver}-aarch64-unknown-linux-gnu.tar.gz",
                      "windows-x86_64": f"nu-{ver}-x86_64-pc-windows-msvc.zip",
                      "windows-aarch64": f"nu-{ver}-aarch64-pc-windows-msvc.zip",
                      "macos-aarch64": f"nu-{ver}-aarch64-apple-darwin.tar.gz",
                      "macos-x86_64": f"nu-{ver}-x86_64-apple-darwin.tar.gz",
                  }
              else:
                  rel = _fetch_json("https://api.github.com/repos/ouch-org/ouch/releases/latest")
                  tag = rel["tag_name"]
                  assets_map = {
                      "linux-x86_64": "ouch-x86_64-unknown-linux-gnu.tar.gz",
                      "linux-aarch64": "ouch-aarch64-unknown-linux-gnu.tar.gz",
                      "windows-x86_64": "ouch-x86_64-pc-windows-msvc.zip",
                      "windows-aarch64": "ouch-aarch64-pc-windows-msvc.zip",
                      "macos-aarch64": "ouch-aarch64-apple-darwin.tar.gz",
                      "macos-x86_64": "ouch-x86_64-apple-darwin.tar.gz",
                  }
              asset_name = assets_map.get(target_pair)
              if not asset_name:
                  raise RuntimeError(f"Cible {kind} non supportée : {target_pair}")
              target_asset = next((a for a in rel.get("assets", []) if a.get("name") == asset_name), None)
              if not target_asset:
                  raise RuntimeError(f"Asset {asset_name} absent de {kind} {tag}")
              dl_url = target_asset["browser_download_url"]
              digest = str(target_asset.get("digest") or "").strip().lower()
              sha256 = digest.removeprefix("sha256:") if digest.startswith("sha256:") else ""
              if not re.fullmatch(r"[0-9a-f]{64}", sha256):
                  chk_asset = next((a for a in rel.get("assets", []) if a.get("name") == f"{asset_name}.sha256" or "sha256" in a.get("name", "").lower()), None)
                  if chk_asset:
                      creq = urllib.request.Request(chk_asset["browser_download_url"], headers={"User-Agent": "Erable-CI-Runner/1.0"})
                      with urllib.request.urlopen(creq, timeout=20) as cr:
                          ctext = cr.read().decode("utf-8", errors="replace")
                      for line in ctext.splitlines():
                          if asset_name in line or len(ctext.splitlines()) == 1:
                              m = re.search(r"\b([0-9a-fA-F]{64})\b", line)
                              if m:
                                  sha256 = m.group(1).lower()
                                  break
              if not re.fullmatch(r"[0-9a-f]{64}", sha256):
                  raise RuntimeError(f"SHA-256 officiel introuvable pour {kind} {tag}/{asset_name}")
              return {"kind": kind, "tag": tag, "asset": asset_name, "url": dl_url, "sha256": sha256}

          requested = [k for k, f in (("nu", needs_nu), ("ouch", needs_ouch)) if f]
          with ThreadPoolExecutor(max_workers=len(requested)) as pool:
              res = {d["kind"]: d for d in pool.map(_resolve, requested)}

          nu_meta = res.get("nu", {"tag": "none", "asset": "", "url": "", "sha256": ""})
          ouch_meta = res.get("ouch", {"tag": "none", "asset": "", "url": "", "sha256": ""})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for prefix, meta in (("nu", nu_meta), ("ouch", ouch_meta)):
                  for k, v in meta.items():
                      if k != "kind":
                          fh.write(f"{prefix}_{k}={v}\n")
          print(f"[+] Résolu nu={nu_meta['tag']} ouch={ouch_meta['tag']}")
          PY

      - name: Cache Nushell & ouch (indexé par versions résolues)
        if: steps.prep_manifests.outputs.needs_nu == 'true' || steps.prep_manifests.outputs.needs_ouch == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/erable-tools
          key: erable-tools-${{ matrix.os-name }}-${{ matrix.arch }}-nu-${{ steps.resolve_tools.outputs.nu_tag }}-${{ steps.resolve_tools.outputs.nu_sha256 }}-ouch-${{ steps.resolve_tools.outputs.ouch_tag }}-${{ steps.resolve_tools.outputs.ouch_sha256 }}

      - name: Installation / Vérification SHA-256 de Nushell et ouch
        if: steps.prep_manifests.outputs.needs_nu == 'true' || steps.prep_manifests.outputs.needs_ouch == 'true'
        shell: bash
        env:
          NEEDS_NU: ${{ steps.prep_manifests.outputs.needs_nu }}
          NU_TAG: ${{ steps.resolve_tools.outputs.nu_tag }}
          NU_ASSET: ${{ steps.resolve_tools.outputs.nu_asset }}
          NU_URL: ${{ steps.resolve_tools.outputs.nu_url }}
          NU_SHA256: ${{ steps.resolve_tools.outputs.nu_sha256 }}
          NEEDS_OUCH: ${{ steps.prep_manifests.outputs.needs_ouch }}
          OUCH_TAG: ${{ steps.resolve_tools.outputs.ouch_tag }}
          OUCH_ASSET: ${{ steps.resolve_tools.outputs.ouch_asset }}
          OUCH_URL: ${{ steps.resolve_tools.outputs.ouch_url }}
          OUCH_SHA256: ${{ steps.resolve_tools.outputs.ouch_sha256 }}
        run: |
          "$PYTHON_BIN" - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import os
          import platform
          import shutil
          import tarfile
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          runner_temp = Path(os.environ.get("RUNNER_TEMP") or ".")
          tools_root = runner_temp / "erable-tools"
          tools_root.mkdir(parents=True, exist_ok=True)
          is_win = platform.system().lower() == "windows"
          ua_headers = {"User-Agent": "Erable-CI-Runner/1.0"}

          def _safe_extract_zip(arc_path: Path, out_dir: Path) -> None:
              root = out_dir.resolve()
              with zipfile.ZipFile(arc_path, "r") as zf:
                  for m in zf.infolist():
                      if m.is_dir():
                          continue
                      parts = [p for p in m.filename.replace("\\", "/").split("/") if p and p != "."]
                      if not parts or ".." in parts:
                          continue
                      dst = root.joinpath(*parts)
                      if not dst.resolve().is_relative_to(root):
                          raise ValueError(f"Zip Slip dans {arc_path.name}: {m.filename}")
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(m) as fi, open(dst, "wb") as fo:
                          shutil.copyfileobj(fi, fo, 65536)

          def _install_tool(kind: str) -> tuple[str, str, str]:
              pfx = kind.upper()
              tag = os.environ[f"{pfx}_TAG"]
              asset = os.environ[f"{pfx}_ASSET"]
              url = os.environ[f"{pfx}_URL"]
              expected_sha = os.environ[f"{pfx}_SHA256"].lower()
              out_dir = tools_root / f"erable-{kind}"
              out_dir.mkdir(parents=True, exist_ok=True)
              bin_name = f"{kind}.exe" if is_win else kind
              env_key = f"{pfx}_BIN"

              existing = next((p for p in out_dir.rglob(bin_name) if p.is_file()), None)
              if existing is not None:
                  if not is_win:
                      os.chmod(existing, 0o755)
                  resolved = str(existing.resolve())
                  print(f"[+] {kind} {tag} restauré depuis le cache : {resolved}")
                  return env_key, resolved, str(existing.parent.resolve())

              arc_path = runner_temp / asset
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=ua_headers)
                      h = hashlib.sha256()
                      with urllib.request.urlopen(req, timeout=60) as resp, open(arc_path, "wb") as out_f:
                          while chunk := resp.read(65536):
                              h.update(chunk)
                              out_f.write(chunk)
                      actual_sha = h.hexdigest().lower()
                      if actual_sha != expected_sha:
                          arc_path.unlink(missing_ok=True)
                          raise RuntimeError(f"SHA-256 mismatch pour {kind} {tag}: attendu={expected_sha}, obtenu={actual_sha}")
                      break
                  except RuntimeError:
                      raise
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 * (attempt + 1))

              try:
                  if asset.endswith(".zip"):
                      _safe_extract_zip(arc_path, out_dir)
                  else:
                      with tarfile.open(arc_path, "r:gz") as tf:
                          try:
                              tf.extractall(out_dir, filter="data")
                          except TypeError:
                              tf.extractall(out_dir)
              finally:
                  arc_path.unlink(missing_ok=True)

              installed = next((p for p in out_dir.rglob(bin_name) if p.is_file()), None)
              if installed is None:
                  raise RuntimeError(f"Binaire {bin_name} introuvable après extraction de {asset}")
              if not is_win:
                  os.chmod(installed, 0o755)
              resolved = str(installed.resolve())
              print(f"[+] {kind} {tag} installé & vérifié SHA-256 : {resolved}")
              return env_key, resolved, str(installed.parent.resolve())

          tasks = [k for k in ("nu", "ouch") if os.environ.get(f"NEEDS_{k.upper()}") == "true"]
          with ThreadPoolExecutor(max_workers=len(tasks)) as pool:
              results = list(pool.map(_install_tool, tasks))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fe, open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as fp:
              for env_key, bin_abs, bin_parent in results:
                  fe.write(f"{env_key}={bin_abs}\n")
                  fp.write(f"{bin_parent}\n")
          PY

      - name: Validation du Binaire et du Cycle de Vie
        shell: bash
        env:
          PACKAGE_NAME: ${{ github.event.client_payload.package_name || inputs.package_name || 'ouch' }}
          PACKAGE_VERSION: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
          PACKAGE_CATEGORY: ${{ github.event.client_payload.category || inputs.category || 'cli' }}
          TARGET_KEY: ${{ matrix.target_key || '' }}
          CHECK_CMD: ${{ github.event.client_payload.check_cmd || inputs.check_cmd || '' }}
        run: |
          "$PYTHON_BIN" runner/validate.py package_test
