name: Multi-OS Trampoline Build (6 OS/Arch)

run-name: "build-trampoline-${{ github.event.client_payload.correlation_id || inputs.correlation_id || github.run_id }}"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou commit Git cible sur GitLab"
        required: false
        default: "main"
      correlation_id:
        description: "Identifiant de corrélation unique (optionnel)"
        required: false
  repository_dispatch:
    types: [build-trampoline]

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x86_64
            target_name: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            is_windows: true
            ouch_asset: ouch-x86_64-pc-windows-msvc.zip
          - os: windows-11-vs2026-arm
            name: Windows ARM64
            target_name: windows-aarch64
            rust_target: aarch64-pc-windows-msvc
            is_windows: true
            ouch_asset: ouch-aarch64-pc-windows-msvc.zip
          - os: ubuntu-latest
            name: Linux x86_64
            target_name: linux-x86_64
            rust_target: x86_64-unknown-linux-musl
            is_linux: true
            ouch_asset: ouch-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-26.04-arm
            name: Linux ARM64
            target_name: linux-aarch64
            rust_target: aarch64-unknown-linux-musl
            is_linux: true
            ouch_asset: ouch-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            name: macOS Apple Silicon (ARM64)
            target_name: macos-aarch64
            rust_target: aarch64-apple-darwin
            is_macos: true
            ouch_asset: ouch-aarch64-apple-darwin.tar.gz
          - os: macos-26-intel
            name: macOS Intel (x86_64)
            target_name: macos-x86_64
            rust_target: x86_64-apple-darwin
            is_macos: true
            ouch_asset: ouch-x86_64-apple-darwin.tar.gz

    steps:
      - name: Identifier et valider la référence Git
        shell: bash
        env:
          INPUT_REF: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
        run: |
          if [[ ! "$INPUT_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]] || [[ "$INPUT_REF" == *".."* ]]; then
            echo "Référence Git invalide : $INPUT_REF" >&2
            exit 1
          fi
          echo "GIT_REF=$INPUT_REF" >> "$GITHUB_ENV"
          echo "Compilation du trampoline sur ${{ matrix.os }} (${{ matrix.target_name }}, target=${{ matrix.rust_target }}) pour la référence $INPUT_REF"

      - name: Cloner le dépôt source Érable Core
        shell: bash
        run: |
          git clone --depth 1 --branch "$GIT_REF" -- https://gitlab.com/cortexa/native-application-ai/erable/core.git core

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo Trampoline
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core/tools/trampoline

      - name: Outils musl statiques (Linux)
        if: matrix.is_linux
        shell: bash
        run: |
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          fi

      - name: Tests unitaires et compilation release du trampoline
        shell: bash
        run: |
          cd core/tools/trampoline
          cargo test --release --target "${{ matrix.rust_target }}" --verbose -- --test-threads=1
          cargo build --release --target "${{ matrix.rust_target }}"
          mkdir -p ../../../dist
          REL_DIR="target/${{ matrix.rust_target }}/release"
          case "${{ matrix.target_name }}" in
            windows-x86_64)
              cp "${REL_DIR}/trampoline.exe" ../../../dist/trampoline.exe
              cp "${REL_DIR}/trampoline.exe" ../../../dist/trampoline-x86_64-windows.exe
              ;;
            windows-aarch64)
              cp "${REL_DIR}/trampoline.exe" ../../../dist/trampoline-aarch64-windows.exe
              ;;
            linux-x86_64)
              cp "${REL_DIR}/trampoline" ../../../dist/trampoline-x86_64-linux
              file ../../../dist/trampoline-x86_64-linux
              ;;
            linux-aarch64)
              cp "${REL_DIR}/trampoline" ../../../dist/trampoline-aarch64-linux
              file ../../../dist/trampoline-aarch64-linux
              ;;
            macos-aarch64)
              cp "${REL_DIR}/trampoline" ../../../dist/trampoline-aarch64-macos
              ;;
            macos-x86_64)
              cp "${REL_DIR}/trampoline" ../../../dist/trampoline-x86_64-macos
              ;;
          esac

      - name: Résolution de la dernière release ouch et son SHA-256 officiel
        id: resolve_ouch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUCH_ASSET: ${{ matrix.ouch_asset }}
        run: |
          PY_BIN="$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)"
          "$PY_BIN" - <<'PY'
          import json
          import os
          import re
          import urllib.request

          asset_name = os.environ["OUCH_ASSET"]
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "Erable-CI-Runner/1.0",
          }
          tok = os.environ.get("GITHUB_TOKEN", "").strip()
          if tok:
              headers["Authorization"] = f"Bearer {tok}"

          req = urllib.request.Request("https://api.github.com/repos/ouch-org/ouch/releases/latest", headers=headers)
          with urllib.request.urlopen(req, timeout=20) as resp:
              rel = json.loads(resp.read().decode("utf-8"))

          tag = rel["tag_name"]
          target_asset = next((a for a in rel.get("assets", []) if a.get("name") == asset_name), None)
          if not target_asset:
              raise RuntimeError(f"Asset {asset_name} introuvable dans ouch {tag}")

          dl_url = target_asset["browser_download_url"]
          digest = str(target_asset.get("digest") or "").strip().lower()
          sha256 = digest.removeprefix("sha256:") if digest.startswith("sha256:") else ""
          if not re.fullmatch(r"[0-9a-f]{64}", sha256):
              chk_asset = next((a for a in rel.get("assets", []) if a.get("name") == f"{asset_name}.sha256" or "sha256" in a.get("name", "").lower()), None)
              if not chk_asset:
                  raise RuntimeError(f"Empreinte SHA-256 introuvable pour ouch {tag}/{asset_name}")
              creq = urllib.request.Request(chk_asset["browser_download_url"], headers={"User-Agent": "Erable-CI-Runner/1.0"})
              with urllib.request.urlopen(creq, timeout=20) as cr:
                  ctext = cr.read().decode("utf-8", errors="replace")
              for line in ctext.splitlines():
                  if asset_name in line or len(ctext.splitlines()) == 1:
                      m = re.search(r"\b([0-9a-fA-F]{64})\b", line)
                      if m:
                          sha256 = m.group(1).lower()
                          break
          if not re.fullmatch(r"[0-9a-f]{64}", sha256):
              raise RuntimeError(f"SHA-256 invalide pour ouch {tag}/{asset_name}: {sha256!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\nurl={dl_url}\nsha256={sha256}\n")
          PY

      - name: Cache binaire ouch (vérifié SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/erable-ouch-trampoline
          key: erable-ouch-tramp-${{ matrix.target_name }}-${{ steps.resolve_ouch.outputs.tag }}-${{ steps.resolve_ouch.outputs.sha256 }}

      - name: Validation croisée du Trampoline avec ouch (latest vérifié SHA-256, natif 6 OS/Arch)
        shell: bash
        env:
          OUCH_TAG: ${{ steps.resolve_ouch.outputs.tag }}
          OUCH_URL: ${{ steps.resolve_ouch.outputs.url }}
          OUCH_SHA256: ${{ steps.resolve_ouch.outputs.sha256 }}
          OUCH_ASSET: ${{ matrix.ouch_asset }}
          OUCH_CACHE_DIR: ${{ runner.temp }}/erable-ouch-trampoline
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          PY_BIN="$(command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1 && echo python3 || echo python)"
          "$PY_BIN" - <<'PY'
          import hashlib
          import os
          import shutil
          import stat
          import subprocess
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          cache_dir = Path(os.environ["OUCH_CACHE_DIR"])
          cache_dir.mkdir(parents=True, exist_ok=True)
          asset_name = os.environ["OUCH_ASSET"]
          expected_sha = os.environ["OUCH_SHA256"].lower()
          is_win = asset_name.endswith(".zip")
          bin_name = "ouch.exe" if is_win else "ouch"

          cached_bin = next((p for p in cache_dir.rglob(bin_name) if p.is_file()), None)
          if cached_bin is None:
              arc = cache_dir / asset_name
              req = urllib.request.Request(os.environ["OUCH_URL"], headers={"User-Agent": "Erable-CI-Runner/1.0"})
              h = hashlib.sha256()
              with urllib.request.urlopen(req, timeout=60) as resp, open(arc, "wb") as out_f:
                  while chunk := resp.read(65536):
                      h.update(chunk)
                      out_f.write(chunk)
              actual_sha = h.hexdigest().lower()
              if actual_sha != expected_sha:
                  arc.unlink(missing_ok=True)
                  raise RuntimeError(f"SHA-256 mismatch pour {asset_name}: attendu={expected_sha}, obtenu={actual_sha}")

              ext = cache_dir / "extracted"
              ext.mkdir(parents=True, exist_ok=True)
              ext_root = ext.resolve()
              if is_win:
                  with zipfile.ZipFile(arc, "r") as zf:
                      for m in zf.infolist():
                          if m.is_dir():
                              continue
                          parts = [p for p in m.filename.replace("\\", "/").split("/") if p and p != "."]
                          if not parts or ".." in parts:
                              continue
                          dst = ext_root.joinpath(*parts)
                          if not dst.resolve().is_relative_to(ext_root):
                              raise ValueError(f"Zip Slip: {m.filename}")
                          dst.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(m) as fi, open(dst, "wb") as fo:
                              shutil.copyfileobj(fi, fo, 65536)
              else:
                  with tarfile.open(arc, "r:gz") as tf:
                      try:
                          tf.extractall(ext_root, filter="data")
                      except TypeError:
                          tf.extractall(ext_root)
              arc.unlink(missing_ok=True)
              cached_bin = next((p for p in ext.rglob(bin_name) if p.is_file()), None)
              if cached_bin is None:
                  raise RuntimeError(f"Binaire {bin_name} introuvable")
              if not is_win:
                  cached_bin.chmod(cached_bin.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          test_dir = Path("test_trampoline")
          test_dir.mkdir(parents=True, exist_ok=True)
          dist_dir = Path("dist")
          if is_win:
              raw_target = test_dir / "ouch_target.exe"
              shutil.copy2(cached_bin, raw_target)
              arm_shim = dist_dir / "trampoline-aarch64-windows.exe"
              x64_shim = dist_dir / "trampoline-x86_64-windows.exe"
              shim_src = arm_shim if arm_shim.is_file() else x64_shim
              shim_dst = test_dir / "ouch.exe"
              shutil.copy2(shim_src, shim_dst)
              (test_dir / "ouch.exe.target").write_text("./ouch_target.exe\n", encoding="utf-8")
              run_bin = str(shim_dst.resolve())
          else:
              raw_target = test_dir / "ouch_target"
              shutil.copy2(cached_bin, raw_target)
              raw_target.chmod(0o755)
              shim_src = next(p for p in dist_dir.glob("trampoline-*") if p.is_file())
              shim_dst = test_dir / "ouch"
              shutil.copy2(shim_src, shim_dst)
              shim_dst.chmod(0o755)
              (test_dir / "ouch.target").write_text("./ouch_target\n", encoding="utf-8")
              run_bin = str(shim_dst.resolve())

          res = subprocess.run([run_bin, "--version"], cwd=test_dir, capture_output=True, text=True, check=True)
          print(f"[+] Validation croisée Trampoline sur {os.environ['TARGET_NAME']} avec ouch {os.environ['OUCH_TAG']}: {res.stdout.strip()}")
          PY

      - name: Téléverser l'artefact compilé
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trampoline-${{ matrix.target_name }}
          path: dist/*
          retention-days: 7

  package-universal-macos:
    name: Assemble macOS Universal & Checksums
    needs: [build]
    runs-on: macos-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Télécharger trampoline-macos-aarch64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trampoline-macos-aarch64
          path: all_dist
      - name: Télécharger trampoline-macos-x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trampoline-macos-x86_64
          path: all_dist
      - name: Télécharger trampoline-windows-x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trampoline-windows-x86_64
          path: all_dist
      - name: Télécharger trampoline-windows-aarch64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trampoline-windows-aarch64
          path: all_dist
      - name: Télécharger trampoline-linux-x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trampoline-linux-x86_64
          path: all_dist
      - name: Télécharger trampoline-linux-aarch64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trampoline-linux-aarch64
          path: all_dist
      - name: Assembler avec lipo et générer SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist checksums
          lipo -create -output dist/trampoline-universal-macos all_dist/trampoline-aarch64-macos all_dist/trampoline-x86_64-macos
          lipo -info dist/trampoline-universal-macos
          cp dist/trampoline-universal-macos all_dist/trampoline-universal-macos
          (cd all_dist && shasum -a 256 trampoline* | sort -k2) > checksums/SHA256SUMS
          cat checksums/SHA256SUMS
      - name: Téléverser trampoline-universal-macos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trampoline-universal-macos
          path: dist/*
          retention-days: 7
      - name: Téléverser trampoline-checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trampoline-checksums
          path: checksums/SHA256SUMS
          retention-days: 7
